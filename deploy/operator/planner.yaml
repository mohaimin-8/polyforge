# JCAC planner service (services/planner). Stateless apart from in-memory
# demand forecasts, which rebuild within 3 control cycles after a restart —
# hence one replica and no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pf-planner
  namespace: polyforge-system
  labels:
    app.kubernetes.io/name: pf-planner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pf-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pf-planner
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: planner
          image: polyforge-planner:dev # python:3.13-slim + repo /services/planner + /research/jcac_sim
          command: ["python", "/app/services/planner/planner.py", "--port", "8090"]
          ports:
            - name: http
              containerPort: 8090
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: pf-planner
  namespace: polyforge-system
spec:
  selector:
    app.kubernetes.io/name: pf-planner
  ports:
    - name: http
      port: 8090
      targetPort: 8090
