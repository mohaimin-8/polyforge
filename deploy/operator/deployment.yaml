apiVersion: v1
kind: Namespace
metadata:
  name: polyforge-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polyforge-operator
  namespace: polyforge-system
  labels:
    app.kubernetes.io/name: polyforge-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: polyforge-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polyforge-operator
    spec:
      serviceAccountName: polyforge-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: polyforge-operator:dev
          args:
            - --leader-elect
          env:
            - name: POLYFORGE_OTLP_ENDPOINT
              value: "" # set to e.g. otel-collector.observability:4318 to export spans
            - name: POLYFORGE_PLANNER_URL
              value: "" # set to e.g. http://pf-planner.polyforge-system:8090 to enable JCAC (W31)
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
