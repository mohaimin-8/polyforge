---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: policies.polyforge.io
spec:
  group: polyforge.io
  names:
    kind: Policy
    listKind: PolicyList
    plural: policies
    shortNames:
    - pfpol
    singular: policy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantRef
      name: Tenant
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .spec.cacheSizeMB
      name: CacheMB
      type: integer
    - jsonPath: .spec.modelTier
      name: Tier
      type: string
    - jsonPath: .status.lastPlanSource
      name: Source
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Policy is the joint resource allocation JCAC controls for one
          tenant.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              PolicySpec is the desired resource allocation for one tenant. The JCAC
              planner writes replicas/cacheSizeMB/modelTier; humans set the bounds.
            properties:
              cacheSizeMB:
                default: 128
                description: |-
                  CacheSizeMB is the semantic-cache budget for this tenant (ADR 0013 in
                  W28 bounds eviction per tenant; this is the knob JCAC turns).
                format: int32
                maximum: 16384
                minimum: 0
                type: integer
              modelTier:
                default: small
                description: ModelTier is the LLM class the gateway routes this tenant
                  to.
                enum:
                - none
                - small
                - mid
                - large
                type: string
              replicaMax:
                default: 10
                description: ReplicaMax is the ceiling the planner may never cross.
                format: int32
                minimum: 1
                type: integer
              replicaMin:
                default: 1
                description: ReplicaMin is the floor the planner may never cross (safety
                  guardrail).
                format: int32
                minimum: 0
                type: integer
              replicas:
                default: 2
                description: Replicas is the desired replica count, clamped to [replicaMin,
                  replicaMax].
                format: int32
                minimum: 0
                type: integer
              targetDeployment:
                description: |-
                  TargetDeployment is the Deployment the operator scales,
                  namespace/name. Defaults to the tenant's gateway deployment.
                type: string
              tenantRef:
                description: TenantRef names the Tenant this policy applies to.
                minLength: 1
                type: string
            required:
            - cacheSizeMB
            - modelTier
            - replicaMax
            - replicaMin
            - replicas
            - tenantRef
            type: object
          status:
            description: PolicyStatus is the observed state of a Policy.
            properties:
              appliedCacheSizeMB:
                description: AppliedCacheSizeMB is the cache budget last written to
                  the ConfigMap.
                format: int32
                type: integer
              appliedModelTier:
                description: AppliedModelTier is the tier last written to the route
                  table.
                enum:
                - none
                - small
                - mid
                - large
                type: string
              appliedReplicas:
                description: AppliedReplicas is the replica count last written to
                  the Deployment.
                format: int32
                type: integer
              conditions:
                description: 'Conditions: the operator maintains "Applied".'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastPlanSource:
                description: |-
                  LastPlanSource records whether the applied values came from the
                  planner, a fallback to the last good plan, or a human.
                type: string
              lastPlanTime:
                description: LastPlanTime is when the planner last produced the applied
                  values.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last acted
                  upon.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
