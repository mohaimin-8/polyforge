global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: polyforge
    environment: local

scrape_configs:
  - job_name: polyforge-control-plane
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080
        labels:
          service: control-plane
