{{- if .Values.planner.enabled }}
# JCAC planner (W31). Demand forecasts are in-memory but durably
# snapshotted via --state-file after every plan (Wave 5): a trend-class
# forecaster rebuilds within ~3 control cycles, but seasonal history
# takes a day — so the state file, not statelessness, is the failover
# story. One replica: the state file has a single writer, and the
# Recreate strategy below keeps it that way across upgrades (and avoids
# the RWO-attach deadlock a rolling update would hit with the PVC).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polyforge-operator.fullname" . }}-planner
  namespace: {{ .Release.Namespace }}
  labels: {{- include "polyforge-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "polyforge-operator.name" . }}-planner
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "polyforge-operator.name" . }}-planner
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        # The planner image runs as 65532 (services/planner/Dockerfile);
        # fsGroup makes the state volume writable for that user under
        # readOnlyRootFilesystem.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: planner
          image: {{ include "polyforge-operator.plannerImage" . }}
          imagePullPolicy: {{ .Values.planner.image.pullPolicy }}
          command:
            - python
            - /app/services/planner/planner.py
            - --port={{ .Values.planner.port }}
            - --alpha={{ .Values.planner.alpha }}
            - --beta={{ .Values.planner.beta }}
            - --gamma={{ .Values.planner.gamma }}
            - --forecast={{ .Values.planner.forecast }}
            - --state-file=/var/lib/polyforge/planner-state.json
          {{- if .Values.planner.auth.enabled }}
          # Defence in depth for /v1/plan and /v1/state, which steer every
          # tenant's capacity and export/overwrite demand history. The
          # NetworkPolicy below is inert on non-enforcing CNIs; this is not.
          env:
            - name: POLYFORGE_PLANNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "polyforge-operator.plannerAuthSecretName" . }}
                  key: {{ include "polyforge-operator.plannerAuthSecretKey" . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.planner.port }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources: {{- toYaml .Values.planner.resources | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /var/lib/polyforge
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.planner.port }}
            initialDelaySeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.planner.port }}
            initialDelaySeconds: 3
      volumes:
        - name: state
          {{- if .Values.planner.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "polyforge-operator.fullname" . }}-planner-state
          {{- else }}
          # emptyDir survives container crashes/OOM restarts (the pod
          # keeps the volume) but not rescheduling; see
          # planner.persistence in values.yaml.
          emptyDir: {}
          {{- end }}
{{- if .Values.planner.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "polyforge-operator.fullname" . }}-planner-state
  namespace: {{ .Release.Namespace }}
  labels: {{- include "polyforge-operator.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.planner.persistence.storageClass }}
  storageClassName: {{ .Values.planner.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.planner.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "polyforge-operator.fullname" . }}-planner
  namespace: {{ .Release.Namespace }}
  labels: {{- include "polyforge-operator.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "polyforge-operator.name" . }}-planner
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.planner.port }}
      targetPort: {{ .Values.planner.port }}
{{- end }}
