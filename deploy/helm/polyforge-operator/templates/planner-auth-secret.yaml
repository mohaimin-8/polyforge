{{- if and .Values.planner.enabled .Values.planner.auth.enabled (not .Values.planner.auth.existingSecret) }}
# Shared bearer token for the planner's /v1/* routes.
#
# Why this exists: the planner speaks plain HTTP (ADR 0014) and its routes are
# not read-only conveniences — GET /v1/state exports every tenant's demand
# history, POST /v1/state overwrites the forecast state the controller plans
# on, and POST /v1/plan steers replicas/cache/tier for all tenants at once.
# The NetworkPolicy was the only control, and it is *inert* on CNIs that do
# not enforce NetworkPolicy (kind's default kindnet, among others) — a control
# that fails open silently. This token is the defence-in-depth layer that does
# not depend on the CNI.
#
# The token is generated once and then pinned: `lookup` reads the token already
# in the cluster so `helm upgrade` does not roll a new value (which would break
# the operator→planner call until both pods restarted). Supply your own with
# planner.auth.existingSecret to manage it out of band.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "polyforge-operator.fullname" . }}-planner-auth
  namespace: {{ .Release.Namespace }}
  labels: {{- include "polyforge-operator.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $name := printf "%s-planner-auth" (include "polyforge-operator.fullname" .) }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- if and $existing (index $existing.data "token") }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc | quote }}
  {{- end }}
{{- end }}
