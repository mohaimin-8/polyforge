---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: budgets.polyforge.io
spec:
  group: polyforge.io
  names:
    kind: Budget
    listKind: BudgetList
    plural: budgets
    shortNames:
    - pfbud
    singular: budget
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantRef
      name: Tenant
      type: string
    - jsonPath: .spec.hourlyCapMilliUSD
      name: CapMilliUSD
      type: integer
    - jsonPath: .status.utilizationPercent
      name: Util%
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Budget bounds one tenant's spend and fairness weight.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BudgetSpec caps what one tenant may spend and how much the planner should
              weight their fairness. Money is integer milli-USD because CRD schemas
              reject floating point and money as floats is a bug factory anyway.
            properties:
              fairnessWeightPermille:
                default: 500
                description: |-
                  FairnessWeightPermille is this tenant's weight in the planner's
                  fairness penalty, 0–1000. Higher means the planner protects this
                  tenant's SLO more aggressively when tenants compete.
                format: int32
                maximum: 1000
                minimum: 0
                type: integer
              hourlyCapMilliUSD:
                default: 1000
                description: |-
                  HourlyCapMilliUSD is the hard hourly spend ceiling in milli-USD
                  (e.g. 2500 = $2.50/hour). The planner must never plan above it.
                format: int64
                minimum: 0
                type: integer
              tenantRef:
                description: TenantRef names the Tenant this budget applies to.
                minLength: 1
                type: string
            required:
            - fairnessWeightPermille
            - hourlyCapMilliUSD
            - tenantRef
            type: object
          status:
            description: BudgetStatus is the observed state of a Budget.
            properties:
              conditions:
                description: 'Conditions: the operator maintains "WithinBudget".'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentHourlySpendMilliUSD:
                description: CurrentHourlySpendMilliUSD is the operator's latest spend
                  estimate.
                format: int64
                type: integer
              lastUpdated:
                description: LastUpdated is when status was last written.
                format: date-time
                type: string
              utilizationPercent:
                description: |-
                  UtilizationPercent is spend/cap, 0–100+ (may exceed 100 briefly
                  between control cycles).
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
