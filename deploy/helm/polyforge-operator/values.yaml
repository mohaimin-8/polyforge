# Default values for polyforge-operator.

operator:
  image:
    repository: ghcr.io/mohaimin-8/polyforge-operator
    tag: ""            # defaults to .Chart.appVersion
    pullPolicy: IfNotPresent
  leaderElect: true
  # OTLP endpoint for reconcile spans, e.g. otel-collector.observability:4318.
  # Empty disables export.
  otlpEndpoint: ""
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi

# Demand source for the JCAC loop: the control plane's per-tenant feature
# API. The loop needs BOTH a planner and a demand source — with url empty
# the operator only enforces static Policy guardrails, exactly as before.
# The operator authenticates either with a tenant-scoped bearer token or,
# as platform infrastructure reading every tenant's features, with the
# platform admin key mounted from a Secret (adminKeySecret wins over token).
features:
  url: ""              # e.g. http://polyforge-control-plane.polyforge.svc:80
  token: ""
  adminKeySecret:
    name: ""           # Secret in the release namespace carrying the admin key
    key: admin-key

# JCAC planner (W31): jointly plans replicas, cache and tier every 10 s.
# Disabled = operator enforces static Policy guardrails only.
planner:
  enabled: true
  image:
    repository: ghcr.io/mohaimin-8/polyforge-planner
    tag: ""            # defaults to .Chart.appVersion
    pullPolicy: IfNotPresent
  port: 8090
  # Objective weights (alpha: cost, beta: SLO, gamma: fairness) — the
  # committed defaults are the W30 Pareto-sweep choice.
  alpha: 1.0
  beta: 2.0
  gamma: 0.5
  # Demand forecaster. `holt` is the pre-registered jcac_v2 configuration
  # (research/analysis/PREREG_V2.md) and the evidence-based recommendation;
  # before this key existed the chart silently ran the planner's argparse
  # default (`trend`), which is not the published configuration. Choices:
  # persistence | trend | holt | seasonal | seasonal_mr (multi-resolution,
  # can see day-scale cycles live — Wave 5).
  forecast: holt
  # Shared bearer token guarding /v1/plan and /v1/state. On by default: those
  # routes steer every tenant's capacity and export/overwrite per-tenant demand
  # history, and the NetworkPolicy below is inert on CNIs that do not enforce
  # NetworkPolicy — a control that fails open silently. With auth on, the chart
  # generates the token once and pins it across upgrades (`lookup`), wiring the
  # same Secret into the planner and the operator.
  #
  # Set enabled: false only for the research/eval harness, which drives the
  # planner directly and reproduces the published campaigns against the
  # historical unauthenticated posture.
  auth:
    enabled: true
    # Manage the token yourself instead: name a Secret holding it.
    existingSecret: ""
    existingSecretKey: token
  # Durable forecast state (`--state-file`, Wave 5): the planner atomically
  # rewrites this file after every plan, so a restart resumes every
  # tenant's demand history instead of cold-starting it. Always on: with
  # `persistence.enabled: false` the file lives on an emptyDir, which
  # survives container crashes/OOM restarts but not pod rescheduling; flip
  # to a PVC when reschedule survival matters — with `seasonal`/
  # `seasonal_mr` especially, day-scale history takes a day to rebuild.
  persistence:
    enabled: false
    size: 100Mi
    storageClass: ""   # "" = the cluster's default StorageClass
  # Cluster-wide capacity ceilings the plan may never exceed. The eval
  # harness overrides these per cluster size so live and sim arms face the
  # same bounds (workloads.CLUSTER_SIZES parity).
  limits:
    replicas: 60
    cacheMB: 4096
  # Planning cells: tenants per planner call. 0 (default) plans the whole
  # portfolio in one call — what the operator did before cells existed.
  #
  # The joint solve is super-linear in tenants; its p95 first crosses the
  # operator's 3 s timeout at 128 tenants, while per-cell latency stays flat
  # at ~195 ms through 1024 (research/analysis/PLANNER_CELLS.md, PS-H1). Set
  # this to 32 — the size every published per-cell latency was measured at —
  # for portfolios approaching that width.
  #
  # The trade is explicit: cells scope the fairness term to each cell instead
  # of the whole portfolio. Under the hash assignment the operator implements,
  # the measured worst-case global-Jain cost is -0.0053 across N in [8, 1024]
  # (PLANNER_CELLS_DEALIAS.md, PF-H1) — small, but not nothing, which is why
  # this is opt-in rather than on by default.
  cellSize: 0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# Three-knob live plane (PREREG_WAVE4_LIVE_PLANE.md): with adminURL set,
# the operator pushes each Policy's cache/tier knobs to the AI gateway's
# admin endpoint and the Applied condition covers all three knobs, not just
# replicas. The admin key is features.adminKeySecret (the platform key).
gateway:
  adminURL: ""         # e.g. http://polyforge-ai-gateway.polyforge.svc:80

# The planner speaks plain unauthenticated HTTP (ADR 0014) and its
# /v1/state endpoints export/overwrite per-tenant demand history, so its
# only defense is the network layer. This NetworkPolicy restricts planner
# ingress to the operator's pods. Inert on CNIs that do not enforce
# NetworkPolicy (e.g. kind's default kindnet); on enforcing CNIs, anything
# else that must reach the planner (a debug shell, the eval harness)
# needs this disabled or its own allow rule.
networkPolicy:
  enabled: true

nameOverride: ""
fullnameOverride: ""
