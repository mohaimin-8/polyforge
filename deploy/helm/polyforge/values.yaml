# Env-specific overrides land here (the point of the chart, per roadmap W10):
# image tag, replica count, and resource limits are all templated.

image:
  repository: polyforge/control-plane
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 2

# Rendered into a Secret; override per environment, never commit real keys.
adminKey: polyforge-kind-admin

postgres:
  adminURL: postgres://polyforge_admin@postgres:5432/polyforge
  appURL: postgres://polyforge_app@postgres:5432/polyforge

redis:
  # Empty disables Redis; limiter and idempotency fall back in-process.
  url: redis://redis:6379/0

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  path: /api

rateLimit:
  requestsPerMinute: 600
  burst: 60

# Eval-harness autoscaling arms (eval/harness/cluster_backend.py). Off by
# default: production scaling belongs to the operator, not raw HPA.
autoscaling:
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilization: 60

# AI gateway leg of the three-knob live plane (PREREG_WAVE4_LIVE_PLANE.md).
# Off by default; the eval harness enables it for live-AI cells. With it on,
# AI traffic gets a real semantic cache (per-tenant budget = the operator's
# cacheSizeMB knob) and real tier routing (modelTier knob -> tierBackends).
gateway:
  enabled: false
  image:
    repository: polyforge/ai-gateway
    tag: dev
    pullPolicy: IfNotPresent
  replicaCount: 1
  # JSON map tier -> backend, e.g.
  # {"small": {"kind": "openai", "base_url": "http://host:9101/v1", "model": "qwen2.5-0.5b-instruct"},
  #  "mid":   {"kind": "openai", "base_url": "http://host:9102/v1", "model": "qwen2.5-3b-instruct"}}
  tierBackends: ""
  # Fallback single backend for requests with no tier pin (unset tiers).
  llmBaseURL: ""
  embedDims: 256
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
