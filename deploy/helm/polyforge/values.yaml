# Env-specific overrides land here (the point of the chart, per roadmap W10):
# image tag, replica count, and resource limits are all templated.

# Defaults are the images release.yml publishes, so `helm install` from the
# published chart pulls something that exists. `polyforge/control-plane:dev`
# was the default until session 43: unqualified, so it resolves to Docker Hub,
# where nothing of that name is published -- the same defect D2 fixed in the
# operator chart and left standing here, because the helm job rendered the
# chart to /dev/null and never looked at what came out. The eval harness runs
# on kind with side-loaded images and overrides both fields back to the local
# names (HELM_EVAL_BASE_VALUES in eval/harness/cluster_backend.py).
image:
  repository: ghcr.io/mohaimin-8/polyforge/control-plane
  tag: ""            # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent

replicaCount: 2

# Rendered into a Secret; override per environment, never commit real keys.
adminKey: polyforge-kind-admin

postgres:
  adminURL: postgres://polyforge_admin@postgres:5432/polyforge
  appURL: postgres://polyforge_app@postgres:5432/polyforge

redis:
  # Empty disables Redis; limiter and idempotency fall back in-process.
  url: redis://redis:6379/0

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    memory: 256Mi

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  path: /api

rateLimit:
  requestsPerMinute: 600
  burst: 60

# Eval-harness autoscaling arms (eval/harness/cluster_backend.py). Off by
# default: production scaling belongs to the operator, not raw HPA.
autoscaling:
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilization: 60

# Network segmentation (templates/networkpolicy.yaml). On by default: this
# release's pods deny all traffic except DNS and the flows below (audit
# 2026-09-26: a plain `helm install` rendered no NetworkPolicy). Requires a CNI
# that enforces NetworkPolicy. The eval harness turns it off
# (HELM_EVAL_BASE_VALUES) so the published live sittings replay on the
# substrate they ran on.
networkPolicy:
  enabled: true
  # Namespace of the ingress controller that fronts both services.
  ingressNamespace: ingress-nginx
  # Namespace of the operator, which pushes cache/tier knobs to the gateway
  # and reads the control plane's telemetry features for its planner.
  operatorNamespace: polyforge-system
  # Namespace of the Prometheus that scrapes /metrics; empty = none.
  metricsNamespace: ""
  # Pod labels of the PostgreSQL and Redis the services use (same namespace).
  postgresSelector:
    app.kubernetes.io/name: postgres
  redisSelector:
    app.kubernetes.io/name: redis
  # Egress rules for the gateway's model and embedding backends. The default
  # is Ollama in the polyforge-ai namespace; backends outside the cluster
  # (e.g. tierBackends on a GPU host) need an ipBlock rule here.
  gatewayModelEgress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: polyforge-ai
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434

# AI gateway leg of the three-knob live plane (PREREG_WAVE4_LIVE_PLANE.md).
# Off by default; the eval harness enables it for live-AI cells. With it on,
# AI traffic gets a real semantic cache (per-tenant budget = the operator's
# cacheSizeMB knob) and real tier routing (modelTier knob -> tierBackends).
gateway:
  enabled: false
  image:
    repository: ghcr.io/mohaimin-8/polyforge/ai-gateway
    tag: ""          # defaults to .Chart.appVersion
    pullPolicy: IfNotPresent
  replicaCount: 1
  # JSON map tier -> backend, e.g.
  # {"small": {"kind": "openai", "base_url": "http://host:9101/v1", "model": "qwen2.5-0.5b-instruct"},
  #  "mid":   {"kind": "openai", "base_url": "http://host:9102/v1", "model": "qwen2.5-3b-instruct"}}
  tierBackends: ""
  # Fallback single backend for requests with no tier pin (unset tiers).
  llmBaseURL: ""
  embedDims: 256
  # Per-tenant admission budget on every AI route (token bucket). Zero keeps
  # the binary's default, which mirrors the control plane's: 600 RPM / 60.
  rateLimit:
    requestsPerMinute: 0
    burst: 0
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
