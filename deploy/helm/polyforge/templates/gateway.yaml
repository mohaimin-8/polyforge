{{- if .Values.gateway.enabled }}
# AI gateway leg of the three-knob live plane (PREREG_WAVE4_LIVE_PLANE.md
# §Substrate 2-3): AI traffic hits this Deployment, whose per-tenant cache
# budget and tier routing are actuated by the operator's Policy reconciler.
# It shares the control plane's store (same postgres values), so its
# telemetry lands where eval-export reads.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}-ai-gateway
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-ai-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: polyforge
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}-ai-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}-ai-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        fsGroup: 65532
        # The operator chart's pod hardening (audit 2026-09-26: this chart
        # omitted it): the runtime's default syscall filter.
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ai-gateway
          image: {{ include "polyforge.image" (dict "image" .Values.gateway.image "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: POLYFORGE_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "polyforge.name" . }}
                  key: admin-key
            {{- if .Values.postgres.adminURL }}
            - name: POLYFORGE_POSTGRES_ADMIN_URL
              value: {{ .Values.postgres.adminURL | quote }}
            - name: POLYFORGE_POSTGRES_APP_URL
              value: {{ .Values.postgres.appURL | quote }}
            {{- else }}
            - name: POLYFORGE_DB_PATH
              value: /data/polyforge.db
            {{- end }}
            {{- if .Values.gateway.tierBackends }}
            - name: POLYFORGE_TIER_BACKENDS
              value: {{ .Values.gateway.tierBackends | quote }}
            {{- end }}
            - name: POLYFORGE_EMBED_DIMS
              value: {{ .Values.gateway.embedDims | quote }}
            {{- if .Values.gateway.llmBaseURL }}
            - name: POLYFORGE_LLM_BASE_URL
              value: {{ .Values.gateway.llmBaseURL | quote }}
            {{- end }}
            {{- if .Values.gateway.rateLimit.requestsPerMinute }}
            - name: POLYFORGE_RATE_LIMIT_RPM
              value: {{ .Values.gateway.rateLimit.requestsPerMinute | quote }}
            - name: POLYFORGE_RATE_LIMIT_BURST
              value: {{ .Values.gateway.rateLimit.burst | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            # A static Go binary on an unprivileged port needs no capability.
            capabilities:
              drop: ["ALL"]
          {{- if not .Values.postgres.adminURL }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if not .Values.postgres.adminURL }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-ai-gateway
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}-ai-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: polyforge
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}-ai-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
{{- end }}
