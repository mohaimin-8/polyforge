{{- if .Values.autoscaling.hpa.enabled }}
# The eval harness's `hpa` baseline: the real Kubernetes autoscaler binary
# scaling the control plane on CPU (eval/harness/cluster_backend.py sets
# autoscaling.hpa.enabled=true for `hpa` runs). Kind clusters need
# metrics-server for this to act — the phase 7 runbook installs it.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "polyforge.name" . }}
  labels:
    {{- include "polyforge.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "polyforge.name" . }}
  minReplicas: {{ .Values.autoscaling.hpa.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.hpa.targetCPUUtilization }}
{{- end }}
