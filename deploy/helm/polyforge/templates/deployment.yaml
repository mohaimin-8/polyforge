apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "polyforge.name" . }}
  labels:
    {{- include "polyforge.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.hpa.enabled }}
  # With the HPA enabled the autoscaler owns this field; setting it here
  # would fight the HPA on every helm upgrade.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "polyforge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "polyforge.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # The distroless image runs as 65532 (nonroot); without fsGroup the
      # SQLite emptyDir is root-owned and the store cannot be created —
      # the pod crash-loops on a read-only-looking /data.
      securityContext:
        fsGroup: 65532
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POLYFORGE_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "polyforge.name" . }}
                  key: admin-key
            {{- if .Values.postgres.adminURL }}
            - name: POLYFORGE_POSTGRES_ADMIN_URL
              value: {{ .Values.postgres.adminURL | quote }}
            - name: POLYFORGE_POSTGRES_APP_URL
              value: {{ .Values.postgres.appURL | quote }}
            {{- else }}
            # SQLite mode (eval kind clusters run self-contained pods): the
            # root filesystem is read-only, so the store lives on an emptyDir.
            - name: POLYFORGE_DB_PATH
              value: /data/polyforge.db
            {{- end }}
            {{- if .Values.redis.url }}
            - name: POLYFORGE_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            {{- end }}
            - name: POLYFORGE_RATE_LIMIT_RPM
              value: {{ .Values.rateLimit.requestsPerMinute | quote }}
            - name: POLYFORGE_RATE_LIMIT_BURST
              value: {{ .Values.rateLimit.burst | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # The distroless :nonroot tag sets a *named* user, which the
            # kubelet cannot verify against runAsNonRoot ("non-numeric user
            # (nonroot)... CreateContainerConfigError") — the numeric UID is
            # required for the pod to start at all. 65532 = distroless nonroot.
            runAsUser: 65532
            runAsGroup: 65532
          {{- if not .Values.postgres.adminURL }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if not .Values.postgres.adminURL }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
