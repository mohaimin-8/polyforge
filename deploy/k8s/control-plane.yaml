apiVersion: v1
kind: Secret
metadata:
  name: control-plane
  namespace: polyforge
type: Opaque
stringData:
  admin-key: polyforge-kind-admin # kind-only placeholder; override in real clusters
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: polyforge
  labels:
    app.kubernetes.io/name: control-plane
    app.kubernetes.io/part-of: polyforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: control-plane
          image: polyforge/control-plane:dev
          imagePullPolicy: IfNotPresent # kind: load with `kind load docker-image`
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POLYFORGE_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane
                  key: admin-key
            - name: POLYFORGE_POSTGRES_ADMIN_URL
              value: postgres://polyforge_admin@postgres:5432/polyforge
            - name: POLYFORGE_POSTGRES_APP_URL
              value: postgres://polyforge_app@postgres:5432/polyforge
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: polyforge
spec:
  selector:
    app.kubernetes.io/name: control-plane
  ports:
    - name: http
      port: 80
      targetPort: http
