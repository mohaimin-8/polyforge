apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polyforge
  namespace: polyforge
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m # matches maxRequestBodyBytes
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /v1 → control-plane: it serves /v1/... (including /v1/auth/*)
          # and nothing under /api, so the old /api rule 404'd every call.
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: control-plane
                port:
                  name: http
