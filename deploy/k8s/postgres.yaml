apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: polyforge
data:
  # Mirrors deploy/postgres/init/001_roles.sql: the app role cannot bypass
  # row-level security; only the admin (migration) role can.
  001_roles.sql: |
    DO $roles$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'polyforge_admin') THEN
            CREATE ROLE polyforge_admin LOGIN BYPASSRLS;
        END IF;
        IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'polyforge_app') THEN
            CREATE ROLE polyforge_app LOGIN NOBYPASSRLS;
        END IF;
    END
    $roles$;
    ALTER DATABASE polyforge OWNER TO polyforge_admin;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: polyforge
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: polyforge
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate # single writer on one PVC; never run two Postgres pods
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - name: POSTGRES_DB
              value: polyforge
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust # kind-only; see README
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "polyforge"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: polyforge
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432
