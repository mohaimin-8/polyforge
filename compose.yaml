services:
  control-plane:
    build: .
    image: polyforge/control-plane:dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POLYFORGE_ADMIN_KEY: ${POLYFORGE_ADMIN_KEY:-polyforge-local-admin}
      POLYFORGE_POSTGRES_ADMIN_URL: postgres://polyforge_admin@postgres:5432/polyforge
      POLYFORGE_POSTGRES_APP_URL: postgres://polyforge_app@postgres:5432/polyforge
      POLYFORGE_REDIS_URL: redis://redis:6379/0
      # Uncomment to ship traces to the collector (observability profile):
      # POLYFORGE_OTLP_ENDPOINT: otel-collector:4318
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # Distroless image has no shell/curl; the binary probes itself.
      test: ["CMD", "/control-plane", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: polyforge
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - polyforge-postgres:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polyforge"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8
    # AOF durability per W13; RDB snapshots remain on by default.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - polyforge-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Analytical store (W25a, ADR 0011). Local fixture like postgres: no
  # password, loopback only. The control plane mirrors telemetry into it
  # when POLYFORGE_CLICKHOUSE_URL=http://localhost:8123 is set.
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_DB: polyforge
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - polyforge-clickhouse:/var/lib/clickhouse
      - ./deploy/clickhouse/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - polyforge-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot: pulls the two W20 models into the shared volume, then exits.
  #   docker compose --profile ai run --rm ollama-init
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull llama3.2:3b && ollama pull phi3.5"]
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./deploy/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.0
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - polyforge-prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.0
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: polyforge-local
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - polyforge-grafana:/var/lib/grafana
    restart: unless-stopped

volumes:
  polyforge-clickhouse:
  polyforge-ollama:
  polyforge-redis:
  polyforge-postgres:
  polyforge-prometheus:
  polyforge-grafana:
