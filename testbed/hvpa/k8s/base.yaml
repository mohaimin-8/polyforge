# WP17 (programme 2): the CPU service, scaled horizontally and vertically, on
# the WP10 kind cluster in its own namespace. kind maps no spare host port, so
# everything that talks to the service runs in the cluster (load generator,
# planner, Prometheus); the host acts through the Kubernetes API only.
apiVersion: v1
kind: Namespace
metadata:
  name: pf-hvpa
  labels:
    app.kubernetes.io/part-of: polyforge-hvpa
---
# The service. requests = limits, so the pod is Guaranteed and an in-place
# resize keeps its QoS class; resizePolicy NotRequired: a CPU resize never
# restarts the container (in-place pod resize, GA in Kubernetes 1.35).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpuburn
  namespace: pf-hvpa
  labels:
    app.kubernetes.io/name: cpuburn
    app.kubernetes.io/part-of: polyforge-hvpa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cpuburn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cpuburn
        app.kubernetes.io/part-of: polyforge-hvpa
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cpuburn
          image: polyforge/cpuburn:dev
          imagePullPolicy: Never
          env:
            - name: WORK_ROUNDS
              value: "20000"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 64Mi
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: cpuburn
  namespace: pf-hvpa
  labels:
    app.kubernetes.io/name: cpuburn
    app.kubernetes.io/part-of: polyforge-hvpa
spec:
  selector:
    app.kubernetes.io/name: cpuburn
  ports:
    - name: http
      port: 80
      targetPort: http
