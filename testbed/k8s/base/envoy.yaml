# tier-lb: per-request least-request balancing over each tier's ready pods.
#
# Why it exists. The gateway's provider client is Go's default transport, which
# keeps at most two idle keep-alive connections per backend host, and
# llama-server (cpp-httplib) keeps a connection for up to 100 requests with a
# 5 s idle timeout. A ClusterIP Service balances CONNECTIONS, so at the
# testbed's concurrency (a few requests in flight) the same one or two
# connections, and therefore the same one or two pods, would carry a tier's
# load while a replica the actuator added sat idle: the port-forward defect of
# WP14 attempt 4 in another place. Envoy keeps its own connections to every pod
# and chooses a pod per request.
#
# Upstream discovery is DNS on the headless tier Services (only Ready pods are
# published), refreshed every second. Envoy closes an idle upstream connection
# after 3 s and recycles it after 90 requests, both inside llama-server's own
# limits (5 s, 100), so Envoy never reuses a connection the server is closing.
# Only connection failures are retried: a chat completion is not idempotent.
admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 9901}
static_resources:
  listeners:
    - name: tier_small
      address:
        socket_address: {address: 0.0.0.0, port_value: 9001}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: tier_small
                codec_type: HTTP1
                route_config:
                  name: tier_small
                  virtual_hosts:
                    - name: tier_small
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          route:
                            cluster: tier_small
                            timeout: 300s
                            retry_policy:
                              retry_on: connect-failure
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: tier_mid
      address:
        socket_address: {address: 0.0.0.0, port_value: 9002}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: tier_mid
                codec_type: HTTP1
                route_config:
                  name: tier_mid
                  virtual_hosts:
                    - name: tier_mid
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          route:
                            cluster: tier_mid
                            timeout: 300s
                            retry_policy:
                              retry_on: connect-failure
                              num_retries: 2
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: tier_small
      connect_timeout: 2s
      lb_policy: LEAST_REQUEST
      cluster_type:
        name: envoy.clusters.dns
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dns.v3.DnsCluster
          dns_refresh_rate: 1s
          respect_dns_ttl: false
          dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options:
            idle_timeout: 3s
            max_requests_per_connection: 90
          explicit_http_config:
            http_protocol_options: {}
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 4096
            max_pending_requests: 4096
            max_requests: 4096
            max_retries: 16
      load_assignment:
        cluster_name: tier_small
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: tier-small.pf-testbed.svc.cluster.local, port_value: 8080}
    - name: tier_mid
      connect_timeout: 2s
      lb_policy: LEAST_REQUEST
      cluster_type:
        name: envoy.clusters.dns
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dns.v3.DnsCluster
          dns_refresh_rate: 1s
          respect_dns_ttl: false
          dns_lookup_family: V4_ONLY
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          common_http_protocol_options:
            idle_timeout: 3s
            max_requests_per_connection: 90
          explicit_http_config:
            http_protocol_options: {}
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 4096
            max_pending_requests: 4096
            max_requests: 4096
            max_retries: 16
      load_assignment:
        cluster_name: tier_mid
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: tier-mid.pf-testbed.svc.cluster.local, port_value: 8080}
