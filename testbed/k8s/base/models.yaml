# Model provisioning: one volume, loaded once, read by every model server.
#
# A PVC rather than a per-pod download: a replica added by the actuator must
# start in seconds (memory-map a file already on the node), not after a 0.5 to
# 1.1 GB download, or the replica knob's actuation delay would be a property
# of the network. kind's default StorageClass (local-path) is node-local and
# ReadWriteOnce, which every pod of this single-node cluster may share.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
  namespace: pf-testbed
  labels:
    app.kubernetes.io/part-of: polyforge-testbed
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      # small 0.47 GiB + mid 1.04 GiB + embedder 0.09 GiB; room for mid3b (1.96 GiB).
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-loader
  namespace: pf-testbed
  labels:
    app.kubernetes.io/name: model-loader
    app.kubernetes.io/part-of: polyforge-testbed
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-loader
        app.kubernetes.io/part-of: polyforge-testbed
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loader
          # The llama.cpp image already carries sh, curl and sha256sum, so the
          # loader costs no extra image.
          image: ghcr.io/ggml-org/llama.cpp:server-b9967
          imagePullPolicy: Never
          command: ["/bin/sh", "/config/load-models.sh"]
          env:
            - name: MODEL_SETS
              value: "embedder small mid"
            - name: LOCK
              value: /config/models.lock
            - name: DEST
              value: /models
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
        - name: config
          configMap:
            name: model-loader
        - name: tmp
          emptyDir: {}
