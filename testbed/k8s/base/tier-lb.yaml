# tier-lb: Envoy in front of both tiers; envoy.yaml says why it exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tier-lb
  namespace: pf-testbed
  labels:
    app.kubernetes.io/name: tier-lb
    app.kubernetes.io/part-of: polyforge-testbed
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tier-lb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tier-lb
        app.kubernetes.io/part-of: polyforge-testbed
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9901"
        prometheus.io/path: /stats/prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          image: docker.io/envoyproxy/envoy:v1.39.6
          imagePullPolicy: Never
          # Bypass the image's entrypoint (it re-execs as uid 101 when started
          # as root); the pod already runs non-root.
          command: ["envoy"]
          args:
            - --config-path
            - /etc/envoy/envoy.yaml
            - --concurrency
            - "1"
            - --disable-hot-restart
            - --log-level
            - warn
          ports:
            - name: small
              containerPort: 9001
            - name: mid
              containerPort: 9002
            - name: admin
              containerPort: 9901
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: tier-lb
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tier-lb
  namespace: pf-testbed
  labels:
    app.kubernetes.io/name: tier-lb
    app.kubernetes.io/part-of: polyforge-testbed
spec:
  selector:
    app.kubernetes.io/name: tier-lb
  ports:
    - name: small
      port: 9001
      targetPort: small
    - name: mid
      port: 9002
      targetPort: mid
