# Shared Postgres for the eval data plane (namespace polyforge).
#
# WHY: the eval chart otherwise stores telemetry in a per-pod SQLite file on an
# emptyDir. When the operator scales polyforge-control-plane to N replicas, the
# run's telemetry splits across N separate per-pod stores, and `eval-export`
# (which execs a SINGLE pod) reads only that pod's slice -> crud/ai p95+p99
# computed on an unrepresentative (often ~empty) sample -> 0. A shared Postgres
# means every replica writes one store and eval-export (any pod) sees every
# event. Roles mirror .github/workflows/ci.yml exactly (Open() verifies them).
#
# Applied by eval/harness/cluster_backend.command_plan ONLY when
# POLYFORGE_EVAL_SHARED_PG=1; the default SQLite path is unchanged.
apiVersion: v1
kind: Namespace
metadata:
  name: polyforge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: polyforge
data:
  # Runs once, as the postgres superuser against POSTGRES_DB, during initdb.
  init.sql: |
    CREATE ROLE polyforge_admin LOGIN BYPASSRLS;
    CREATE ROLE polyforge_app LOGIN NOBYPASSRLS;
    ALTER DATABASE polyforge OWNER TO polyforge_admin;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: polyforge
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # max_connections lifted well above the default 100: N control-plane
          # replicas each open an admin + app pgxpool, which at default pool
          # sizing can exceed 100 and CrashLoop the deployment.
          # max_connections lifted for N replicas x 2 pools; the rest is
          # write-stall tuning, added after Stage B attempt 6 (session 39).
          #
          # WHY. That run aborted on 68 dropped iterations from a spontaneous
          # excursion at T+32m -- 399 VUs on one tenant, max request 5,696 ms --
          # with NO pod restarts, node memory at 9%, and no autovacuum. What the
          # observer did catch is telemetry ingestion collapsing about sixfold
          # immediately before it (~8,000 rows per sample to ~1,350), inside a
          # checkpoint window. pgdata is an emptyDir on a VHDX under WSL2, which
          # is the slowest storage in this stack by a wide margin.
          #
          # The control plane writes each telemetry event synchronously, so a
          # storage stall blocks request handlers -- and `latency_ms` cannot see
          # it, because that clock stops before the write. Server-side crud_p95
          # stayed at ~2.4 ms while clients waited seconds. Same shape as
          # attempt 4's 464x server-vs-client gap.
          #
          # synchronous_commit=off is correct HERE and would not be on a real
          # deployment: this store exists to be measured and thrown away, and
          # the only thing at risk is the last few telemetry rows if the pod
          # dies. max_wal_size and checkpoint_timeout cut checkpoint frequency
          # so the remaining fsync bursts are rarer. Disclosed in the prereg.
          args: ["postgres",
                 "-c", "max_connections=500",
                 "-c", "shared_buffers=256MB",
                 "-c", "synchronous_commit=off",
                 "-c", "max_wal_size=4GB",
                 "-c", "checkpoint_timeout=30min",
                 # WP14 attempt 7. synchronous_commit=off stops COMMITS waiting
                 # on the WAL, but checkpoints still fsync the data files, and a
                 # checkpoint fsync on a VHDX under WSL2 is precisely the
                 # multi-second stall that ended attempt 6 at 10 h 44 m with a
                 # 19.5 s worst request. fsync=off removes every fsync in the
                 # engine, which is the only remaining lever on this host that
                 # targets the measured mechanism rather than a symptom.
                 #
                 # Correct HERE and nowhere else: this store exists to be
                 # measured and then deleted with the cluster. The cost is that
                 # an unclean pod stop corrupts the database -- and a run whose
                 # PostgreSQL died is already void, so nothing measurable is at
                 # risk. full_page_writes=off cuts WAL volume for the same
                 # reason. Both are disclosed in PREREG_LIVE_SOAK_V5.md.
                 "-c", "fsync=off",
                 "-c", "full_page_writes=off"]
          env:
            - name: POSTGRES_DB
              value: polyforge
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            # TCP (-h 127.0.0.1), NOT the unix socket: during initdb the entry
            # point runs a socket-only temp server, so a socket check would pass
            # before the init.sql roles exist. TCP is up only after init completes.
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-d", "polyforge"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: initdb
          configMap:
            name: postgres-init
        - name: pgdata
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: polyforge
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
