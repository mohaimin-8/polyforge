# W36 ablations: PolyForge minus one contribution at a time, on the medium
# cluster across every workload x mix cell. jcac itself is included so the
# ablation deltas come from the same experiment file.
#   5 systems x 5 workloads x 4 mixes x 1 cluster x 5 reps = 500 runs
name: ablations
backend: sim
steps: 120
reps: 5
systems: [jcac, jcac_noclassifier, jcac_nojoint, jcac_noeviction, jcac_nofairness]
workloads: [crud_bursty, crud_steady, ai_cacheable, ai_uncacheable, agentic]
tenant_mixes: [uniform, premium_heavy, besteffort_heavy, whale]
cluster_sizes: [medium]
output: eval/results/ablations.duckdb
retries: 2
timeseries_reps: 1
