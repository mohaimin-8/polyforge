# PREREG_RISK_MPC.md: risk-aware (quantile) MPC — the cost/violation frontier.
# jcac_anchored is the point-forecast end of the frontier (the quotable
# controller, RESULTS_MOVE_CLAMP); jcac_q70..q95 add headroom drawn from the
# controller's own forecast residuals. hpa/keda/concurrency are the tuned
# reactive arms whose attainment the frontier is measured against. Cells
# mirror the v1 headline matrix exactly.
name: matrix_risk
backend: sim
steps: 120
reps: 5
systems: [jcac_anchored, jcac_q70, jcac_q80, jcac_q90, jcac_q95, hpa, keda, concurrency]
workloads: [crud_bursty, crud_steady, ai_cacheable, ai_uncacheable, agentic]
tenant_mixes: [uniform, premium_heavy, besteffort_heavy, whale]
cluster_sizes: [small, medium, large]
output: eval/results/raw_sim_risk.duckdb
retries: 2
timeseries_reps: 0
