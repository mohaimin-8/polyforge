tenant_mixes: [uniform, premium_heavy, besteffort_heavy, whale]
cluster_sizes: [small, medium, large]
output: eval/results/raw_sim_matrix_sm_tierwu.duckdb
retries: 2
timeseries_reps: 0
model_form:
  wu_tier_mid: 1.475
  wu_tier_large: 1.518
