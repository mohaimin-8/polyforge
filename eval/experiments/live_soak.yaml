# PREREG_LIVE_SOAK.md (session 38, WP14) — the 24 h live CRUD-plane soak.
# Frozen and pushed before the run.
#
# 8640 steps x STEP_SECONDS (10 s) = 24 h of continuous k6 load against one
# kind cluster. POLYFORGE_EVAL_LIVE_AI stays UNSET: no AI gateway, no GPU,
# CRUD load only — the surface the prereg scores (operator, planner, replica
# and cache knobs, audit path). POLYFORGE_EVAL_SHARED_PG=1 is required (R5)
# so every control-plane replica writes one Postgres and eval-export sees the
# whole run rather than one pod's slice.
#
# ATTEMPT 5 (PREREG_LIVE_SOAK_V3.md, session 39). Faults come from
# scripts/stage_b_controls.sh -- the mechanisms the validation ladder proved,
# not new code -- launched alongside with
#   SCHEDULE=7200:planner,18000:cpu,28800:planner,39600:cpu,#            50400:planner,61200:cpu,72000:planner,82800:cpu
# i.e. planner scale-to-zero at T+2/8/14/20 h and CPU starvation at
# T+5/11/17/23 h.
#
# The apiserver throttle that occupied half of V2's schedule is RETIRED: its
# FlowSchema matches (40/40 impersonated operator-identity requests dispatched)
# but the level has never rejected a request -- 3 concurrency seats,
# nominalConcurrencyShares already at the minimum 1, and the operator never has
# 3 requests in flight. It has no reachable mechanism, so the sitting injects
# fewer real faults rather than more cosmetic ones.
#
# Also required for this attempt:
#   POLYFORGE_EVAL_BUCKET_SECONDS=3600      SK-H3, hour buckets
#   POLYFORGE_EVAL_FINE_BUCKET_SECONDS=60   SK-H1, 5-minute recovery
# Percentiles do not aggregate, so one export width cannot serve both.
#
# `medium` per the prereg; drop to `small` and disclose if Docker cannot hold
# it, because duration outranks width for this work package.
name: live_soak
backend: cluster
steps: 8640
reps: 1
systems: [jcac]
workloads: [crud_bursty]
tenant_mixes: [uniform]
cluster_sizes: [medium]
output: eval/results/live_soak.duckdb
retries: 0
timeseries_reps: 0
