# PREREG_HK_ADOPTION.md (Wave 2): the v1 headline matrix under the measured
# LMSYS cache curve (SEMANTIC_CACHE.md Phase 3b fit: hmax 0.285, half-size
# 19 MB at the documented ~3 KB/entry). Exact mirror of full.yaml except
# `economy`; the curve applies to every cache-using system identically.
name: matrix_hk
backend: sim
steps: 120
reps: 5
systems: [jcac, hpa, keda, firm, static, gptcache]
workloads: [crud_bursty, crud_steady, ai_cacheable, ai_uncacheable, agentic]
tenant_mixes: [uniform, premium_heavy, besteffort_heavy, whale]
cluster_sizes: [small, medium, large]
output: eval/results/raw_sim_hk.duckdb
retries: 2
timeseries_reps: 1
economy:
  cache_hit_max: 0.285
  cache_half_mb: 19.0
