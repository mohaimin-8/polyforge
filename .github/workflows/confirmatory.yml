# WP13 step 5 (programme 2): the confirmatory simulation campaign, run from the frozen
# commit C with the drand round the registered protocol names as its only input.
# Start it once that round is due by pushing a tag named after the round at C:
#   git tag wp14-round-<N> wp14-c && git push origin wp14-round-<N>
# (GitHub offers "Run workflow" for a workflow_dispatch workflow only once this file is on
# the default branch; on 2026-11-20 it was not, and GitHub did not list the workflow at all.
# Once it is there, Actions > confirmatory > Run workflow, "Use workflow from" the tag wp14-c,
# with the round, does the same.) A draw pushed before the round is due stops with "not yet":
# re-run the failed jobs once it is due. The procedure allows one run; every run stays in
# the repository's Actions history, so a second one cannot be hidden.
#
#   draw   fetch the round from two agreeing relays, derive the master seed (draw.json)
#   run    one job per shard of research/registration/campaign.json, each under 6 hours
#   score  the frozen scorer on every shard's output, then SHA256SUMS over all of it;
#          the hashes go to the run summary, everything to the "confirmatory" artifact
#
# The logic, and every refusal, is in research/registration/confirm.py.
name: confirmatory

on:
  push:
    tags: ["wp14-round-*"]
  workflow_dispatch:
    inputs:
      round:
        description: "drand quicknet round named by the registered protocol"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: confirmatory
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  draw:
    runs-on: ubuntu-24.04   # the image the WP14 rehearsal ran on (Python 3.13)
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      round: ${{ steps.round.outputs.round }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: round
        name: The round (the tag's name on a push, the input on a dispatch)
        env:
          INPUT_ROUND: ${{ inputs.round }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then round="${GITHUB_REF_NAME#wp14-round-}"; else round="$INPUT_ROUND"; fi
          case "$round" in ''|*[!0-9]*) echo "not a round number: '$round'" >&2; exit 2;; esac
          echo "round=$round" >> "$GITHUB_OUTPUT"
      - name: Fetch the named round from two relays and derive the master seed
        env:
          ROUND: ${{ steps.round.outputs.round }}
        run: python research/registration/confirm.py draw --round "$ROUND" --out draw
      - id: shards
        name: The shards the manifest fixes
        run: |
          list=$(python research/registration/confirm.py shards)
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: draw
          path: draw/draw.json
          if-no-files-found: error
          retention-days: 90

  run:
    needs: draw
    runs-on: ubuntu-24.04   # the image the WP14 rehearsal ran on (Python 3.13)
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.draw.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned dependencies
        run: pip install -r eval/requirements-reproduce.txt
      - uses: actions/download-artifact@v4
        with:
          name: draw
          path: draw
      - name: Run this shard
        env:
          SHARD: ${{ matrix.shard }}
        run: python research/registration/confirm.py run --draw draw/draw.json --shard "$SHARD" --out "shard-$SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 90
          # A shard lost to the runner (not to its own code) can be re-run with the same draw;
          # its new upload replaces the partial one, and every attempt's log stays in the history.
          overwrite: true

  score:
    needs: [draw, run]
    runs-on: ubuntu-24.04   # the image the WP14 rehearsal ran on (Python 3.13)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned dependencies
        run: pip install -r eval/requirements-reproduce.txt
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Score every shard with the frozen scorer
        run: python research/registration/confirm.py score --draw results/draw/draw.json --results results --out results/score
      - name: Seal the results and publish the hashes
        env:
          ROUND: ${{ needs.draw.outputs.round }}
        run: |
          python research/registration/confirm.py seal results
          {
            echo "## Confirmatory campaign: round ${ROUND}, commit ${GITHUB_SHA}"
            echo
            echo '```'
            cat results/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: confirmatory
          path: results
          if-no-files-found: error
          retention-days: 90
