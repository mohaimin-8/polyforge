# Programme 2's CPU campaigns on GitHub Actions (research/offload.py): the queue's own
# commands (research/run_queue.py), split into shards, while the laptop runs the live
# testbed. Pushing a branch named offload/<campaign> at a commit starts it:
#
#   plan        the shard list (research/offload.py's default for the campaign)
#   crosscheck  committed WP9 evaluation runs run again on this platform (informational)
#   run         one job per shard, each well under 6 hours on 4 vCPU
#   finalize    the shards merged and checked, then the campaign's own command on them;
#               the outputs the queue commits go to the "outputs" artifact
#
# Back on the laptop: gh run download <id> -n outputs -D <dir>, then
# python research/offload.py collect <campaign> --artifact <dir> --run-url <url>.
#
# offload/secretscan* lists gitleaks' findings on the commits main lacks (redacted).
# offload/reproduce* instead runs scripts/reproduce_programme2.py once (the queue's last
# step): every programme-2 report rebuilt from the committed data; its log and any drift
# (git status, git diff) go to the "reproduce" artifact. Nothing is committed.
# offload/rehearsal* rehearses WP14's confirmatory campaign (research/registration/wp14_*.py):
# the full job list built and timed, then two of everything run with a made-up master
# seed and scored; the "rehearsal" artifact holds it. A pipeline check, never a result.
name: campaign

on:
  push:
    branches: ["offload/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  reproduce:
    if: startsWith(github.ref_name, 'offload/reproduce')
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # steps that name a commit (WP12's plans) read the history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/requirements-campaigns.txt
      - run: pip install -r research/requirements-campaigns.txt
      - name: Every programme-2 report rebuilt from the committed data
        run: python scripts/reproduce_programme2.py 2>&1 | tee reproduce.log
      - name: What drifted
        if: always()
        run: |
          git status --short > drift.txt
          git diff > drift.diff
          cat drift.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduce
          path: |
            reproduce.log
            drift.txt
            drift.diff
          retention-days: 30

  secretscan:
    if: startsWith(github.ref_name, 'offload/secretscan')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: The CI's pinned gitleaks on the commits main does not have, each finding listed (redacted)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code=0 --log-opts="origin/main..HEAD"             --report-format json --report-path findings.json 2>&1 | tee scan.log
      - uses: actions/upload-artifact@v4
        with:
          name: secretscan
          path: |
            findings.json
            scan.log
          retention-days: 30

  rehearsal:
    if: startsWith(github.ref_name, 'offload/rehearsal')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/requirements-campaigns.txt
      - run: pip install -r research/requirements-campaigns.txt
      - name: The full job list (a made-up master seed), timed
        shell: bash   # -eo pipefail: tee does not hide a failure
        run: |
          mkdir -p rehearsal
          python - <<'PY' 2>&1 | tee rehearsal/plan.log
          import collections, json, sys, time
          sys.path.insert(0, "research/registration")
          import wp14_campaign as c
          t = time.time()
          jobs, workloads = c.plan(c.REHEARSAL_MASTER, json.loads(c.DESIGN.read_text(encoding="utf-8")))
          print(f"{len(jobs)} jobs, {len(workloads)} drawn workloads, built in {time.time() - t:.0f} s")
          print(dict(collections.Counter((j["part"], j.get("plant", "")) for j in jobs)))
          PY
      - name: Two of everything, run
        shell: bash
        run: python research/registration/wp14_campaign.py --rehearsal --out rehearsal/shard-0 2>&1 | tee rehearsal/run.log
      - name: And scored
        run: python research/registration/wp14_score.py --rehearsal --results rehearsal --out rehearsal/score
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal
          path: rehearsal
          retention-days: 30

  plan:
    if: "!startsWith(github.ref_name, 'offload/reproduce') && !startsWith(github.ref_name, 'offload/secretscan') && !startsWith(github.ref_name, 'offload/rehearsal')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      shards: ${{ steps.plan.outputs.list }}
      n: ${{ steps.plan.outputs.n }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/requirements-campaigns.txt
      - name: Install the laptop's versions
        run: pip install -r research/requirements-campaigns.txt
      - id: plan
        name: The campaign's runs and shards
        run: |
          list=$(python research/offload.py plan "${GITHUB_REF_NAME#offload/}")
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "n=$(python -c 'import json, sys; print(len(json.loads(sys.argv[1])))' "$list")" >> "$GITHUB_OUTPUT"

  crosscheck:
    if: "!startsWith(github.ref_name, 'offload/reproduce') && !startsWith(github.ref_name, 'offload/secretscan') && !startsWith(github.ref_name, 'offload/rehearsal')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/requirements-campaigns.txt
      - run: pip install -r research/requirements-campaigns.txt
      - name: Committed WP9 evaluation runs, run again here
        run: python research/offload.py crosscheck

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/requirements-campaigns.txt
      - run: pip install -r research/requirements-campaigns.txt
      - name: Run this shard
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.n }}
        run: python research/offload.py run "${GITHUB_REF_NAME#offload/}" --shard "$SHARD" --shards "$SHARDS" --out "shard-$SHARD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30

  finalize:
    needs: [plan, run]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: research/requirements-campaigns.txt
      - run: pip install -r research/requirements-campaigns.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
      - name: Merge the shards and run the campaign's own command on them
        env:
          OFFLOAD_SHARDS: ${{ needs.plan.outputs.n }}
          OFFLOAD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python research/offload.py finalize "${GITHUB_REF_NAME#offload/}" --shards-dir shards --stage outputs
      - uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: outputs
          if-no-files-found: error
          retention-days: 30
