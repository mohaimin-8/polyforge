name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: polyforge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d polyforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POLYFORGE_TEST_POSTGRES_ADMIN_URL: postgres://polyforge_admin@localhost:5432/polyforge?sslmode=disable
      POLYFORGE_TEST_POSTGRES_APP_URL: postgres://polyforge_app@localhost:5432/polyforge?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Create database roles
        run: |
          # -i is load-bearing: without it docker exec discards the heredoc
          # and psql exits 0 having executed nothing.
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d polyforge -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE polyforge_admin LOGIN BYPASSRLS CREATEDB;
          CREATE ROLE polyforge_app LOGIN NOBYPASSRLS;
          ALTER DATABASE polyforge OWNER TO polyforge_admin;
          SQL
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
      - name: Test (race detector + coverage)
        run: go test ./... -count=1 -race -covermode=atomic -coverprofile=coverage.out
      # The suite above uses fake clients, which cannot reproduce optimistic
      # concurrency, CEL validation, or status subresources — the three
      # mechanisms the session-35 audit found real defects in. envtest runs
      # the operator against a real apiserver, so those tests are build-tagged
      # (keeping `go test ./...` green without the binaries) and run here.
      # setup-envtest is a BUILD-TIME tool: it downloads the apiserver and etcd
      # binaries envtest runs against, and never enters the shipped artifact.
      # Two facts collide here. Every tagged version of its module - the only
      # ones published are v0.24.0, v0.24.1 and v0.25.0 - declares `go 1.26.0`,
      # and this repo pins the toolchain to 1.25.12 because that is where a set
      # of reachable stdlib CVEs is fixed. So the TOOL is built with an auto
      # toolchain while the TESTS still run under the pinned one; the pin that
      # matters for the product is untouched.
      #
      # The version is pinned as well. It was @latest, and on 2026-09-05 that
      # resolved to v0.25.0 and broke this job on an upstream release with
      # nothing in the tree changing - the same class of defect as the unpinned
      # analysis dependencies: a floating version underneath a gate.
      - name: Operator tests against a real apiserver (envtest)
        env:
          ENVTEST_VERSION: v0.24.1
          ENVTEST_K8S: 1.31.0
        run: |
          tool="sigs.k8s.io/controller-runtime/tools/setup-envtest@${ENVTEST_VERSION}"
          GOTOOLCHAIN=auto go run "$tool" use "$ENVTEST_K8S" --bin-dir "$RUNNER_TEMP/envtest"
          assets="$(GOTOOLCHAIN=auto go run "$tool" use "$ENVTEST_K8S" --bin-dir "$RUNNER_TEMP/envtest" -p path)"
          KUBEBUILDER_ASSETS="$assets" \
            go test -tags envtest ./internal/operator/controllers/ -run Envtest -count=1 -v
      - name: Coverage gate
        # Ratchet: raise toward the 80% target as packages gain tests.
        # First green CI run (2026-07-09) measured 66.5% with the PostgreSQL suite.
        # Session 42 re-measured 68.8% after the postgres store's CRUD, outbox and
        # saga paths gained tests (that package went 32.7% -> 63.2%). The gate moved
        # 60 -> 65 to hold the gain, kept below the measurement so ordinary drift
        # does not redden CI. NOTE: this total counts generated deepcopy and cmd/
        # main() wiring; on business logic alone it is 79.5%.
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{gsub("%","",$3); print $3}')
          echo "total statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 65.0) }' || { echo "FAIL: coverage ${total}% is below the 65% gate"; exit 1; }

  # SEPARATE JOBS ON PURPOSE. These two used to be the last steps of `test`,
  # behind the envtest step - and on 2026-09-05 that turned out to matter: an
  # upstream release broke envtest's tooling, the job stopped there, and the
  # CVE gate behind it did not run for a week. By the time it ran again the
  # toolchain pin was five patch releases stale and govulncheck found SEVEN
  # reachable stdlib vulnerabilities (docs/SECURITY.md, session 43). A gate
  # placed behind a fragile step is a gate that stops running silently, so a
  # gate that must never be masked gets its own job.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Reachability-aware CVE gate. govulncheck fails only on
      # vulnerabilities our code actually *calls*, so it does not turn
      # every advisory in the module graph into a red build. Added after a
      # manual audit found GO-2026-5970 (infinite-loop DoS in
      # golang.org/x/text, reachable from the OIDC token exchange) sitting
      # in the tree with nothing to catch it — see docs/SECURITY.md.
      - name: Vulnerability scan (reachable symbols)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli lint api/openapi.yaml

  # W23: no secrets in the repo or its history. gitleaks scans every push
  # over the full history (fetch-depth: 0 is what makes that true).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # W24: supply-chain evidence. A CycloneDX SBOM of the Go module tree is
  # generated by syft and published as a build artifact on every run;
  # image signing lives in release.yml where an image is actually pushed.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: polyforge-sbom.cdx.json

  # W33/W34: the Python surface — JCAC simulator + baselines, planner
  # service, and the evaluation harness (config expansion, DB integrity,
  # backends). A quick 4-run experiment exercises the runner end to end.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install harness dependencies
        run: pip install -r eval/requirements.txt
      - name: Simulator + baselines tests
        run: python -m unittest discover -s research/jcac_sim -q
      - name: Planner service tests
        run: python -m pytest services/planner -q
      - name: Harness tests
        run: python -m pytest eval/tests -q
      - name: Smoke the runner end to end (4 runs)
        # Independent of the suites above, so a failure there must not skip
        # it: that is how three steps went unrun on 2026-09-05.
        if: always()
        working-directory: eval
        run: |
          python -m harness.runner experiments/smoke.yaml --limit 4
          python -c "
          import sys; sys.path.insert(0, '.')
          from harness import results
          con = results.connect('results/smoke.duckdb')
          n = con.execute(\"SELECT count(*) FROM runs WHERE status='valid'\").fetchone()[0]
          assert n == 4, f'expected 4 valid runs, got {n}'
          "
      - name: Security study runs (cache side channel)
        # Independent of the suites above, so a failure there must not skip
        # it: that is how three steps went unrun on 2026-09-05.
        if: always()
        run: python research/security/cache_side_channel.py

  # D3's gate, in its own job for the reason vulncheck is: it was the last
  # step of `python` and a torch import three steps earlier skipped it.
  supplement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install pytest
      - name: Evidence supplement build (gate parity, dead links, determinism)
        run: python -m pytest scripts/test_build_pages.py -q

  # Phase 9: the trace pipelines must stay runnable — synthetic modes are
  # deterministic and dependency-light, so a broken ETL fails CI, not a
  # future measurement session. The cache protocol runs on its hash
  # fallback here (no sentence-transformers in CI): protocol code path
  # identical, encoder swapped, as documented in the script.
  trace-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install harness dependencies
        run: pip install -r eval/requirements.txt
      - name: BurstGPT ETL (synthetic mode)
        working-directory: research/traces
        run: python etl_burstgpt.py --synthetic --seed 42 --out /tmp/burst_synth
      - name: Semantic-cache protocol (synthetic + hash fallback)
        working-directory: research/analysis
        run: |
          python semantic_cache_eval.py
          git checkout -- SEMANTIC_CACHE.md

  # Session 28: every push proves the paper's numbers re-derive on a clean
  # checkout — the "git tier" of scripts/reproduce.py rebuilds RESULTS.md,
  # ADVANCED.md, and the figures from the committed metrics_*.csv.gz
  # exports into a scratch dir (archive-only inputs are skipped by design)
  # and the frozen committed records must come through untouched.
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # PINNED, unlike every other job here. Byte-identity is a claim about
      # exact output, and a `>=` floor cannot support it: this job was
      # installing pandas 3.0.5 and numpy 2.5.2 against the pandas 2.2.3 /
      # numpy 2.2.3 that wrote the records, so the gate was red in CI while
      # green on the author's machine. See eval/requirements-reproduce.txt.
      - name: Install the pinned analysis dependencies
        run: pip install -r eval/requirements-reproduce.txt
      - name: Verify inputs and dependencies
        run: python scripts/reproduce.py --check
      - name: Rebuild records + figures from committed exports
        run: python scripts/reproduce.py --out /tmp/reproduce_out
      # A drift here reads "N changed lines" and nothing else, which is exactly
      # the information you do not have when the machine that reproduces is not
      # the machine that failed. reproduce.py already writes a unified diff per
      # drifted record; print it rather than making the next person guess.
      - name: Show what drifted
        if: failure()
        run: |
          for f in /tmp/reproduce_out/diff_*.txt; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            head -60 "$f"
          done
      - name: Committed records untouched
        run: git diff --exit-code

  # W39: both Helm charts must lint and render.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
      - name: Lint charts
        run: |
          helm lint deploy/helm/polyforge
          helm lint deploy/helm/polyforge-operator
      - name: Render operator chart (planner on and off)
        run: |
          helm template t deploy/helm/polyforge-operator > /dev/null
          helm template t deploy/helm/polyforge-operator --set planner.enabled=false > /dev/null
