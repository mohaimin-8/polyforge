name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: polyforge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d polyforge"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      POLYFORGE_TEST_POSTGRES_ADMIN_URL: postgres://polyforge_admin@localhost:5432/polyforge?sslmode=disable
      POLYFORGE_TEST_POSTGRES_APP_URL: postgres://polyforge_app@localhost:5432/polyforge?sslmode=disable
      # The service above is supposed to be there, so a missing fixture is a
      # failure here rather than a skip. A skip prints `ok`, and this suite is
      # the only cover RLS tenant isolation has.
      POLYFORGE_REQUIRE_POSTGRES: "1"
      POLYFORGE_REQUIRE_PLANNER: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Create database roles
        run: |
          # -i is load-bearing: without it docker exec discards the heredoc
          # and psql exits 0 having executed nothing.
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -d polyforge -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE polyforge_admin LOGIN BYPASSRLS CREATEDB;
          CREATE ROLE polyforge_app LOGIN NOBYPASSRLS;
          ALTER DATABASE polyforge OWNER TO polyforge_admin;
          SQL
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6.2
      # TestLivePlannerContract and TestCellsScaleOnShippedPath skip without
      # this URL, and CI never set it -- so the only check that crosses the
      # Go/Python boundary to the shipped planner, and the only one that
      # exercises the shipped cell-scaling path, both skipped on every run
      # while `go test` printed ok. The planner is stdlib-only (ADR 0014),
      # so starting it costs nothing but the port.
      - name: Start the planner service the operator tests call
        run: |
          nohup python3 services/planner/planner.py --port 8090 > planner.log 2>&1 &
          curl -sS --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:8090/healthz
          echo "POLYFORGE_TEST_PLANNER_URL=http://127.0.0.1:8090" >> "$GITHUB_ENV"

      - name: Test (race detector + coverage)
        run: go test ./... -count=1 -race -covermode=atomic -coverprofile=coverage.out
      # Ordered directly after the step that writes coverage.out, and that is
      # deliberate. It used to sit AFTER the envtest step, which it does not
      # depend on at all -- so for the week envtest was broken on an upstream
      # release (R5), this gate did not run and nothing said so. R6 recorded
      # the placement as a real dependency on 'the step before it'; envtest
      # was the step before it. Moving it up removes the coupling rather than
      # papering over it with if: always(), which would run the gate even when
      # there is no coverage profile to read.
      - name: Coverage gate
        # Ratchet: raise toward the 80% target as packages gain tests.
        # First green CI run (2026-07-09) measured 66.5% with the PostgreSQL suite.
        # Session 42 re-measured 68.8% after the postgres store's CRUD, outbox and
        # saga paths gained tests (that package went 32.7% -> 63.2%). The gate moved
        # 60 -> 65 to hold the gain, kept below the measurement so ordinary drift
        # does not redden CI. NOTE: this total counts generated deepcopy and cmd/
        # main() wiring; on business logic alone it is 79.5%.
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{gsub("%","",$3); print $3}')
          echo "total statement coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t >= 65.0) }' || { echo "FAIL: coverage ${total}% is below the 65% gate"; exit 1; }

      # The suite above uses fake clients, which cannot reproduce optimistic
      # concurrency, CEL validation, or status subresources — the three
      # mechanisms the session-35 audit found real defects in. envtest runs
      # the operator against a real apiserver, so those tests are build-tagged
      # (keeping `go test ./...` green without the binaries) and run here.
      # setup-envtest is a BUILD-TIME tool: it downloads the apiserver and etcd
      # binaries envtest runs against, and never enters the shipped artifact.
      # Two facts collide here. Every tagged version of its module - the only
      # ones published are v0.24.0, v0.24.1 and v0.25.0 - declares `go 1.26.0`,
      # and this repo pins the toolchain to 1.25.12 because that is where a set
      # of reachable stdlib CVEs is fixed. So the TOOL is built with an auto
      # toolchain while the TESTS still run under the pinned one; the pin that
      # matters for the product is untouched.
      #
      # The version is pinned as well. It was @latest, and on 2026-09-05 that
      # resolved to v0.25.0 and broke this job on an upstream release with
      # nothing in the tree changing - the same class of defect as the unpinned
      # analysis dependencies: a floating version underneath a gate.
      - name: Operator tests against a real apiserver (envtest)
        env:
          ENVTEST_VERSION: v0.24.1
          ENVTEST_K8S: 1.31.0
        run: |
          tool="sigs.k8s.io/controller-runtime/tools/setup-envtest@${ENVTEST_VERSION}"
          GOTOOLCHAIN=auto go run "$tool" use "$ENVTEST_K8S" --bin-dir "$RUNNER_TEMP/envtest"
          assets="$(GOTOOLCHAIN=auto go run "$tool" use "$ENVTEST_K8S" --bin-dir "$RUNNER_TEMP/envtest" -p path)"
          KUBEBUILDER_ASSETS="$assets" \
            go test -tags envtest ./internal/operator/controllers/ -run Envtest -count=1 -v
  # SEPARATE JOBS ON PURPOSE. These two used to be the last steps of `test`,
  # behind the envtest step - and on 2026-09-05 that turned out to matter: an
  # upstream release broke envtest's tooling, the job stopped there, and the
  # CVE gate behind it did not run for a week. By the time it ran again the
  # toolchain pin was five patch releases stale and govulncheck found SEVEN
  # reachable stdlib vulnerabilities (docs/SECURITY.md, session 43). A gate
  # placed behind a fragile step is a gate that stops running silently, so a
  # gate that must never be masked gets its own job.
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Reachability-aware CVE gate. govulncheck fails only on
      # vulnerabilities our code actually *calls*, so it does not turn
      # every advisory in the module graph into a red build. Added after a
      # manual audit found GO-2026-5970 (infinite-loop DoS in
      # golang.org/x/text, reachable from the OIDC token exchange) sitting
      # in the tree with nothing to catch it — see docs/SECURITY.md.
      # The version is pinned, and the tool is built with an auto toolchain,
      # for the two reasons the envtest step above already documents. On
      # 2026-09-08 `@latest` resolved to v1.8.0, which declares `go 1.26.0`,
      # and this job died with `requires go >= 1.26.0 (running go 1.25.14;
      # GOTOOLCHAIN=local)` - a floating version underneath a gate, in the one
      # gate whose whole purpose is to never stop running silently. The TOOL
      # builds under whatever toolchain it needs; the ANALYSIS still runs
      # against this repo's pinned toolchain, which is the version whose
      # stdlib CVEs the gate exists to catch.
      - name: Vulnerability scan (reachable symbols)
        env:
          GOVULNCHECK_VERSION: v1.8.0
        run: |
          GOTOOLCHAIN=auto go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go version
          "$(go env GOPATH)/bin/govulncheck" ./...

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint OpenAPI
        run: # Pinned. It was @redocly/cli (floating), which is a linter version
          # that can change underneath a gate without anything in the tree
          # changing -- the shape that broke setup-envtest in R5. 2.51.2
          # is the version this spec was verified against.
          npx --yes @redocly/cli@2.51.2 lint api/openapi.yaml

  # W23: no secrets in the repo or its history. gitleaks scans every push
  # over the full history (fetch-depth: 0 is what makes that true).
  # gitleaks/gitleaks-action@v2 was here, and it ran `gitleaks detect
  # --log-opts=-1` -- ONE commit per run. The job asked for fetch-depth: 0
  # precisely so a full scan was possible, then scanned the tip and printed
  # green. History from before the action was added had never been scanned
  # at all, while the README lists gitleaks as security hardening and this
  # repository is headed for public artifact review. The full history was
  # scanned offline first (378 commits, 233 MB, no leaks) so a finding would
  # not have surfaced in a log; it is clean, and now CI keeps it that way.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned; the action's scan range is not ours to set)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full history, and prove the scan covered it
        run: |
          set -euo pipefail
          ./gitleaks detect --source . --redact --exit-code=1 --log-level=info 2>&1 | tee scan.log
          scanned=$(grep -oE '[0-9]+ commits scanned' scan.log | grep -oE '^[0-9]+' | head -1)
          total=$(git rev-list --count HEAD)
          # The floor is every commit that ADDS at least one line of text: a
          # commit that only deletes or renames has no patch lines for
          # gitleaks to read, and cannot introduce a secret. Comparing with
          # the raw commit count failed on 2026-09-21 ("494 of 495") the
          # moment a delete-only commit (989894e) landed.
          floor=$(git log --format='format:@%h' --numstat | awk '/^@/{if(seen) n+=(add>0); seen=1; add=0; next} NF>=3 && $1!="-" {add+=$1} END{if(seen) n+=(add>0); print n}')
          echo "gitleaks scanned ${scanned:-0} commits; $floor of $total add text"
          if [ "${scanned:-0}" -lt "$floor" ]; then
            echo "FAILED: covered ${scanned:-0} commits but $floor add text; a green scan that read one commit is what this replaces."
            exit 1
          fi

  # W24: supply-chain evidence. A CycloneDX SBOM of the Go module tree is
  # generated by syft and published as a build artifact on every run;
  # image signing lives in release.yml where an image is actually pushed.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          artifact-name: polyforge-sbom.cdx.json

  # W33/W34: the Python surface — JCAC simulator + baselines, planner
  # service, and the evaluation harness (config expansion, DB integrity,
  # backends). A quick 4-run experiment exercises the runner end to end.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install harness dependencies
        run: pip install -r eval/requirements.txt
      # `unittest discover` exits 0 when it discovers NOTHING -- measured: a
      # pattern matching no file prints NO TESTS RAN and returns 0. This suite
      # is 167 tests, the largest in the repo and the only cover the simulator
      # has, so a rename or an import error at the discovery root would remove
      # all of it from CI in silence. pytest does not share the flaw (exit 5 on
      # an empty collection, measured), so only this one needs the assertion.
      # The floor sits below the current count for the same reason the coverage
      # gate does: it catches the suite vanishing, not ordinary churn.
      - name: Simulator + baselines tests
        run: |
          set -euo pipefail
          python -m unittest discover -s research/jcac_sim 2>&1 | tee sim.log
          ran=$(grep -oE '^Ran [0-9]+ test' sim.log | grep -oE '[0-9]+' | head -1)
          echo "simulator suite ran ${ran:-0} tests"
          if [ "${ran:-0}" -lt 150 ]; then
            echo "FAIL: expected at least 150 simulator tests, ran ${ran:-0}"
            exit 1
          fi
      - name: Planner service tests
        run: python -m pytest services/planner -q
      - name: Harness tests
        run: python -m pytest eval/tests -q
      - name: Smoke the runner end to end (4 runs)
        # Independent of the suites above, so a failure there must not skip
        # it: that is how three steps went unrun on 2026-09-05.
        if: always()
        working-directory: eval
        run: |
          python -m harness.runner experiments/smoke.yaml --limit 4
          python -c "
          import sys; sys.path.insert(0, '.')
          from harness import results
          con = results.connect('results/smoke.duckdb')
          n = con.execute(\"SELECT count(*) FROM runs WHERE status='valid'\").fetchone()[0]
          assert n == 4, f'expected 4 valid runs, got {n}'
          "
      - name: Security study runs (cache side channel)
        # Independent of the suites above, so a failure there must not skip
        # it: that is how three steps went unrun on 2026-09-05.
        if: always()
        run: python research/security/cache_side_channel.py

  # 23 tests across four files that pin properties of the analysis layer -
  # trace parity, budget parity, the shared stats helpers, and SK-H1's
  # discriminability cross-check - and until session 43 CI ran NONE of them.
  # They existed, passed locally, and gated nothing. Own job, for the reason
  # vulncheck and supplement have one: a gate that shares a job with a
  # fragile step is a gate that stops running without saying so.
  # The cardinal rule, checked instead of asserted. Needs full history:
  # a depth-1 checkout has none, so every ordering check would pass on a
  # single commit -- check_preregs.py refuses a shallow clone rather than
  # reporting that as success.
  preregs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install pytest pyyaml duckdb
      - name: No frozen rule was touched after its result existed
        run: python scripts/check_preregs.py
      - name: The gate itself can fail
        run: python -m pytest scripts/test_check_preregs.py -q
      # Audit 2026-09-26: the rule above never compared a protocol with when
      # its campaign RAN. On a clean clone only committed run exports carry
      # run times (the DuckDBs are on Zenodo), so CI judges the live
      # campaigns and the archive tier judges the rest.
      - name: Every campaign ran after its protocol existed
        if: always()
        run: python scripts/check_prereg_timing.py
      - name: The timing gate itself can fail
        if: always()
        run: python -m pytest scripts/test_check_prereg_timing.py -q
      # Same full history: the thesis-drift report dates every record and
      # document from git, and must be the list a fresh build produces.
      - name: The thesis-drift report is current
        run: python -m pytest scripts/test_thesis_drift.py -q

  analysis-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned analysis dependencies
        run: pip install -r eval/requirements-reproduce.txt
      - name: Analysis layer tests
        run: python -m pytest research/analysis -q

  # D3's gate, in its own job for the reason vulncheck is: it was the last
  # step of `python` and a torch import three steps earlier skipped it.
  supplement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: pip install pytest boto3
      - name: Evidence supplement build (gate parity, dead links, determinism)
        run: python -m pytest scripts/test_build_pages.py -q
      # The B1 box is launched and terminated on EC2 by scripts/aws_box.py; the
      # RunInstances shape (terminate-on-shutdown, delete-on-termination gp3,
      # one instance), the ssh-only ingress, AMI fallback and the credential
      # refusal are testable without a meter.
      - name: Rented-host driver builds a request that cannot leave a bill behind
        run: python -m pytest scripts/test_aws_box.py -q
      # The records are gated byte-for-byte; the roadmap is prose that copies
      # from them, and nothing read the copy. A node share was quoted as
      # 0.3166 in three places for a record that reports 0.3165.
      - name: Numbers the roadmap quotes still match their records
        run: python -m pytest scripts/test_roadmap_claims.py -q

  # Phase 9: the trace pipelines must stay runnable — synthetic modes are
  # deterministic and dependency-light, so a broken ETL fails CI, not a
  # future measurement session. The cache protocol runs on its hash
  # fallback here (no sentence-transformers in CI): protocol code path
  # identical, encoder swapped, as documented in the script.
  trace-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install harness dependencies
        run: pip install -r eval/requirements.txt
      - name: BurstGPT ETL (synthetic mode)
        working-directory: research/traces
        run: python etl_burstgpt.py --synthetic --seed 42 --out /tmp/burst_synth
      - name: Semantic-cache protocol (synthetic + hash fallback)
        working-directory: research/analysis
        run: |
          python semantic_cache_eval.py
          # `git checkout -- SEMANTIC_CACHE.md` was here. The smoke run
          # overwrote the published LMSYS + MiniLM record with synthetic
          # numbers and CI quietly undid it; on a machine with
          # sentence-transformers installed that swap reads adaptive@0.85
          # = 1.000 against the published 0.296. The script now refuses to
          # write the published record unless the run has its provenance,
          # so this asserts the file was left alone instead of repairing it.
          git diff --exit-code -- SEMANTIC_CACHE.md

  # Session 28: every push proves the paper's numbers re-derive on a clean
  # checkout — the "git tier" of scripts/reproduce.py rebuilds RESULTS.md,
  # ADVANCED.md, and the figures from the committed metrics_*.csv.gz
  # exports into a scratch dir (archive-only inputs are skipped by design)
  # and the frozen committed records must come through untouched.
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # PINNED, unlike every other job here. Byte-identity is a claim about
      # exact output, and a `>=` floor cannot support it: this job was
      # installing pandas 3.0.5 and numpy 2.5.2 against the pandas 2.2.3 /
      # numpy 2.2.3 that wrote the records, so the gate was red in CI while
      # green on the author's machine. See eval/requirements-reproduce.txt.
      - name: Install the pinned analysis dependencies
        run: pip install -r eval/requirements-reproduce.txt
      - name: Verify inputs and dependencies
        run: python scripts/reproduce.py --check
      - name: Rebuild records + figures from committed exports
        run: python scripts/reproduce.py --out /tmp/reproduce_out
      # A drift here reads "N changed lines" and nothing else, which is exactly
      # the information you do not have when the machine that reproduces is not
      # the machine that failed. reproduce.py already writes a unified diff per
      # drifted record; print it rather than making the next person guess.
      - name: Show what drifted
        if: failure()
        run: |
          for f in /tmp/reproduce_out/diff_*.txt; do
            [ -e "$f" ] || continue
            echo "=== $f ==="
            head -60 "$f"
          done
      - name: Committed records untouched
        run: git diff --exit-code

  # W39: both Helm charts must lint and render.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
      - name: Lint charts
        run: |
          helm lint deploy/helm/polyforge
          helm lint deploy/helm/polyforge-operator
      # `helm template ... > /dev/null` was here. It catches a chart that
      # fails to render and nothing else: if planner.enabled stopped removing
      # the planner, or a chart default drifted to an image release.yml does
      # not publish, this job stayed green. The second one was not
      # hypothetical -- D2 found the operator chart defaulting to an image
      # name that had never been published, by hand, and the SAME defect was
      # still sitting in the application chart in session 43:
      # `polyforge/control-plane:dev`, unqualified, resolving to Docker Hub.
      - name: Render the charts, and check what they rendered
        run: |
          set -euo pipefail
          helm template t deploy/helm/polyforge-operator > on.yaml
          helm template t deploy/helm/polyforge-operator --set planner.enabled=false > off.yaml
          helm template t deploy/helm/polyforge > app.yaml
          helm template t deploy/helm/polyforge --set gateway.enabled=true > gw.yaml

          if ! grep -q 'polyforge/planner' on.yaml; then
            echo "FAIL: the default operator render has no planner image"; exit 1
          fi
          if grep -q 'polyforge/planner' off.yaml; then
            echo "FAIL: planner.enabled=false still renders the planner"; exit 1
          fi

          published="ghcr.io/${GITHUB_REPOSITORY}/(control-plane|ai-gateway|operator|planner)"
          rendered=$(grep -hE '^[[:space:]]+image:' on.yaml off.yaml app.yaml gw.yaml \
            | sed -E 's#^[[:space:]]+image:[[:space:]]*##; s#"##g; s#[:@][^/]*$##' | sort -u)
          echo "rendered image repositories:"; echo "$rendered"
          bad=$(echo "$rendered" | grep -vE "^${published}$" || true)
          if [ -n "$bad" ]; then
            echo "FAIL: the charts default to image(s) release.yml does not publish:"
            echo "$bad"
            exit 1
          fi

