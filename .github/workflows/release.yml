name: release

# W24 supply chain: on a version tag, build and push the image to GHCR,
# generate its CycloneDX SBOM, and sign both with cosign keyless (Sigstore
# OIDC — the signature is bound to this workflow's identity, no key to
# leak). Verify with:
#
#   cosign verify ghcr.io/mohaimin-8/polyforge/control-plane:<tag> \
#     --certificate-identity-regexp 'github.com/mohaimin-8/polyforge' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/control-plane:${{ github.ref_name }}
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository }}/control-plane@${{ steps.push.outputs.digest }}
      - name: Generate image SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/control-plane@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Attest the SBOM to the image
        run: |
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json \
            ghcr.io/${{ github.repository }}/control-plane@${{ steps.push.outputs.digest }}
